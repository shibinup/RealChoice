name: realchoice
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  shared_preferences: ^2.5.6
  cloud_firestore: ^7.1.0
  crypto: ^3.0.6

  # Media picking
  image_picker: ^1.1.2
  video_player: ^2.9.2

  # HTTP for Cloudinary REST upload (no Cloud Functions needed)
  http: ^1.6.0

  # .env secret loading
  flutter_dotenv: ^6.0.1

  # UUID for unique filenames
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
